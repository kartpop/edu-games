<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Numbers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF6EE;
    --ink: #3E4A59;
    --soft: #9AA2AE;
    --line: #D6CDBB;
    --card: #FFFDF8;
    /* one soft tint per group of ten */
    --d0: #E3F1EA;
    --d1: #F8E6DA;
    --d2: #E9E4F3;
    --d3: #F6EFD5;
    --d4: #DDEBF4;
    --d5: #F5E1E6;
    --d6: #E6EEDC;
    --d7: #F2E8DC;
    --d8: #E1E6F5;
    --d9: #DCF0EE;
    --coral: #E3A08C;
    --ring: #D27C63;
    /* a deeper tint per group of ten, for its bead and its column's outline */
    --b0: #9CCFB3; --b1: #EBB28C; --b2: #B9A9DC; --b3: #E2C978; --b4: #9DC3DF;
    --b5: #E0A0B1; --b6: #AFC991; --b7: #D6B48E; --b8: #A2AFE0; --b9: #93CEC7;  /* rings around tiles and cards: darker than --coral so they're easy to spot */
    --good: #D3EBDA;
    --goodline: #94C7A3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: Nunito, ui-rounded, system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  button { font-family: inherit; color: inherit; }

  #app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding: 56px 20px 8px; }
  .main { flex: 1; min-height: 0; display: flex; gap: 28px; }
  .panel {
    flex: 0 0 38%; display: flex; flex-direction: column;
    justify-content: center; align-items: center; gap: 28px; text-align: center;
  }
  #app.wide .panel { flex-basis: 30%; }
  .board { flex: 1; min-width: 0; min-height: 0; position: relative; container-type: size; }
  @media (orientation: portrait) {
    #app { padding-top: 52px; }
    .main { flex-direction: column; gap: 16px; }
    .panel { flex: 0 0 auto; gap: 16px; }
  }

  /* ---------- top corners ---------- */
  .icon {
    position: fixed; top: 10px; z-index: 20;
    width: 42px; height: 42px; border-radius: 50%; border: 0;
    background: transparent; color: var(--soft); font-size: 22px; cursor: pointer;
  }
  #gear { left: 12px; }
  #musicBtn { right: 12px; }
  #musicBtn.off { opacity: .35; text-decoration: line-through; }
  .title {
    position: fixed; top: 18px; left: 0; right: 0; text-align: center;
    font-weight: 800; font-size: 17px; letter-spacing: .06em; color: var(--soft); pointer-events: none;
  }

  /* ---------- question panel ---------- */
  .prompt { font-size: clamp(26px, 3.4vw, 50px); font-weight: 700; line-height: 1.45; min-height: 1.5em; }
  .prompt b { font-weight: 800; }
  .prompt small { display: block; font-size: .5em; color: var(--soft); }
  .num { display: inline-block; background: var(--t); border-radius: 14px; padding: 0 .3em; min-width: 1.7em; }
  .say {
    border: 0; background: var(--card); border-radius: 50%; width: 52px; height: 52px;
    font-size: 22px; cursor: pointer; box-shadow: 0 1px 0 rgba(0,0,0,.06);
  }
  .skip {
    border: 0; background: #F1ECE2; border-radius: 30px; padding: 10px 22px;
    font-size: 18px; font-weight: 700; color: var(--soft); cursor: pointer;
  }
  .skip[hidden] { display: none; }
  .choices { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .choices:empty { display: none; }
  .card {
    min-width: clamp(96px, 11vw, 150px); height: clamp(80px, 13vh, 130px); padding: 0 18px;
    font-size: clamp(40px, 5vw, 66px); font-weight: 800;
    border: 0; border-radius: 22px; background: var(--card); cursor: pointer;
    box-shadow: inset 0 0 0 2px #EDE6D8;
    transition: background .4s, opacity .4s, box-shadow .4s;
  }

  /* ---------- number grid: columns of ten, 1–10 top to bottom ---------- */
  .grid {
    --cols: 5;
    position: absolute; top: 0; bottom: 0; left: 0; right: 0; margin-inline: auto;
    width: min(100cqw, var(--cols) * 16.4cqh);
    display: grid; grid-template-columns: repeat(var(--cols), 1fr); grid-template-rows: repeat(10, 1fr);
    grid-auto-flow: column;
    column-gap: clamp(10px, 25cqw / var(--cols), 44px); row-gap: clamp(3px, .9cqh, 8px);
  }
  .tile {
    border: 0; border-radius: 12px; padding: 0; cursor: pointer; min-width: 0;
    background: var(--t); font-weight: 700; font-size: min(5.2cqh, 35cqw / var(--cols));
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 3px transparent;
    transition: background .4s, opacity .4s, box-shadow .4s, color .4s;
  }
  .tile.qmark { color: var(--coral); font-weight: 800; }
  .tile.ref, .card.ref { box-shadow: inset 0 0 0 4px var(--ring); }
  .tile { position: relative; z-index: 1; }
  /* a tens bead lights up its whole column; a ones bead lights up one square after them */
  .colring {
    grid-row: 1 / span 10; margin: -5px; border-radius: 16px; pointer-events: none; z-index: 0;
    transition: box-shadow .5s, background .5s;
  }
  .colring.on { box-shadow: inset 0 0 0 4px var(--b); background: color-mix(in srgb, var(--b) 30%, transparent); }
  .tile.one { box-shadow: inset 0 0 0 4px var(--b); background: color-mix(in srgb, var(--b) 45%, var(--t)); }
  .tile.dim, .card.dim { opacity: .4; }
  .tile.glow, .card.glow { animation: breathe 2.4s ease-in-out infinite; }
  .tile.good, .card.good { background: var(--good); box-shadow: inset 0 0 0 3px var(--goodline); animation: none; }
  @keyframes breathe {
    0%, 100% { box-shadow: inset 0 0 0 3px rgba(210,124,99,.35); }
    50% { box-shadow: inset 0 0 0 5px rgba(210,124,99,1); }
  }

  /* ---------- bead frame: a T rod and an O rod on a base, beads stack up from the bottom ---------- */
  .panel > * { flex-shrink: 0; } /* so text can't overflow a squeezed box: fitBeads() makes room instead */
  .panel:has(#beads:not([hidden])) { gap: 14px; }
  .panel:has(#beads:not([hidden])) .prompt { font-size: clamp(24px, 2.8vw, 40px); line-height: 1.3; }
  #beads { --bh: 28px; /* fitBeads() makes the beads smaller when the panel is short */ --rw: clamp(76px, 8vw, 104px); display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #beads[hidden] { display: none; }
  .frame { display: flex; gap: 20px; align-items: flex-end; padding: 0 10px; border-bottom: 5px solid var(--line); border-radius: 0 0 6px 6px; }
  .rod { position: relative; width: var(--rw); height: calc(10 * (var(--bh) + 4px) + 10px); border: 0; padding: 0; background: none; cursor: pointer; }
  .rod::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 5px; margin-left: -2.5px; background: var(--line); border-radius: 3px; }
  .rod:disabled { cursor: default; }
  .rod::before, .bead { transition: opacity .5s, background .45s, border-color .45s; }
  .rod:disabled::before, .rod:disabled .bead:not(.on) { opacity: .3; }
  .bead { position: absolute; left: 6px; right: 6px; height: var(--bh); border-radius: 50%; border: 2px dashed #E2DACB; }
  .bead.on { border: 2px solid rgba(62,74,89,.2); background: var(--b); box-shadow: inset 0 -4px 0 rgba(0,0,0,.06); }
  .rodnames, .digits { display: flex; gap: 20px; padding: 0 10px; }
  .rodnames div, .digits div { width: var(--rw); text-align: center; }
  .rodnames b { font-size: 28px; font-weight: 800; line-height: 1; }
  .digits div {
    height: clamp(44px, 7vh, 60px); border-radius: 14px; background: var(--card); box-shadow: inset 0 0 0 2px #EDE6D8;
    display: flex; align-items: center; justify-content: center; font-size: clamp(30px, 5vh, 42px); font-weight: 800; transition: background .5s;
  }
  .digits div.set { background: var(--good); box-shadow: inset 0 0 0 2px var(--goodline); }
  #beadDone { border: 0; border-radius: 30px; padding: 10px 26px; font-size: 20px; font-weight: 800; background: var(--d4); cursor: pointer; }
  #beadDone[hidden] { display: none; }

  #arrows { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .bridge { fill: none; stroke: var(--line); stroke-width: 2; stroke-linecap: round; }
  .hint { fill: none; stroke: var(--coral); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 1 8; animation: fadein .8s ease; }
  @keyframes fadein { from { opacity: 0; } }

  /* ---------- slow turtle = time ---------- */
  .time { position: relative; height: 40px; flex: 0 0 auto; }
  .track { position: absolute; left: 10px; right: 10px; top: 55%; border-top: 2px dotted var(--line); }
  #turtle {
    --p: 0;
    position: absolute; top: 55%; left: calc(6px + var(--p) * (100% - 46px));
    transform: translateY(-55%) scaleX(-1); font-size: 26px; transition: left 1s linear;
  }
  #note { position: absolute; right: 12px; top: -4px; font-size: 15px; font-weight: 700; color: var(--soft); }
  /* the turtle naps when the questions fall behind (lenient time) */
  #zzz { position: absolute; left: -6px; bottom: 80%; white-space: nowrap; font-size: 13px; color: var(--soft); opacity: 0; transition: opacity 1.5s; transform: scaleX(-1); }
  #turtle.asleep #zzz { opacity: 1; }

  /* ---------- full screens ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 10; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; text-align: center;
  }
  .overlay[hidden] { display: none; }
  .overlay h1 { margin: 0; font-size: clamp(44px, 8vmin, 72px); font-weight: 800; }
  .overlay p { margin: 0; font-size: clamp(20px, 3vmin, 28px); color: var(--soft); font-weight: 700; }
  .strip { display: flex; gap: 8px; margin-bottom: 8px; }
  .strip span { width: 54px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; }
  .big { font-size: clamp(100px, 22vmin, 190px); line-height: 1.1; animation: float 6s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-8px); } }
  .btn {
    font-weight: 800; font-size: 28px; padding: 18px 48px; margin-top: 18px;
    border-radius: 40px; border: 0; background: var(--d4); cursor: pointer;
  }
  .small-note { position: absolute; bottom: 18px; font-size: 14px !important; }

  #settings { background: rgba(250,246,238,.92); z-index: 30; }
  .sheet {
    background: var(--card); border-radius: 24px; padding: 26px 28px; width: min(460px, 100%);
    box-shadow: 0 6px 30px rgba(62,74,89,.12); text-align: left;
    max-height: 100%; overflow-y: auto;
  }
  .sheet h2 { margin: 0 0 14px; font-size: 22px; }
  .sheet h3 { margin: 16px 0 0; font-size: 17px; }
  .sheet .hint-text { margin: 2px 0 4px; font-size: 14px; font-weight: 600; color: var(--soft); }
  .row.q { padding: 5px 0; font-size: 16px; }
  .step { display: flex; align-items: center; gap: 4px; }
  .step button { border: 0; border-radius: 50%; width: 34px; height: 34px; font-size: 20px; font-weight: 800; background: #F1ECE2; cursor: pointer; }
  .step output { min-width: 40px; text-align: center; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; font-size: 18px; font-weight: 700; }
  .row input { width: 22px; height: 22px; accent-color: #8FB8D0; }
  .row select { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 8px 10px; border-radius: 12px; border: 0; background: #F1ECE2; color: var(--ink); }
  .seg { display: flex; gap: 6px; }
  .seg button { border: 0; border-radius: 12px; padding: 8px 12px; font-weight: 700; font-size: 16px; background: #F1ECE2; cursor: pointer; }
  .seg button.on { background: var(--d4); box-shadow: inset 0 0 0 2px #A9C8DB; }
  .slide { display: flex; align-items: center; gap: 10px; flex: 1; max-width: 240px; }
  .row .slide input { flex: 1; width: auto; height: 22px; accent-color: #8FB8D0; }
  .slide output { min-width: 56px; text-align: right; }
  .btns { justify-content: flex-end; padding-top: 18px; }
  .btn.sm { font-size: 18px; padding: 10px 22px; margin: 0; }
  .btn.alt { background: #F1ECE2; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<button id="gear" class="icon" title="Hold for settings" aria-label="Settings (hold)">⚙︎</button>
<button id="musicBtn" class="icon" title="Music on/off" aria-label="Music on/off">♪</button>

<div id="app">
  <div class="title">NUMBERS</div>
  <div class="main">
    <div class="panel">
      <div class="prompt" id="prompt"></div>
      <div class="choices" id="choices"></div>
      <div id="beads" hidden>
        <div class="frame">
          <button class="rod" id="rodT" aria-label="Tens beads"></button>
          <button class="rod" id="rodO" aria-label="Ones beads"></button>
        </div>
        <div class="rodnames"><div><b>T</b></div><div><b>O</b></div></div>
        <div class="digits"><div id="digT"></div><div id="digO"></div></div>
        <button id="beadDone" hidden>Done ✓</button>
      </div>
      <button class="say" id="say" aria-label="Say it again">🔊</button>
      <button class="skip" id="skip" hidden>Skip counting ⏭</button>
    </div>
    <div class="board">
      <div class="grid" id="grid">
        <svg id="arrows">
          <defs>
            <marker id="mb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
              <path d="M2 1.5 L8 5 L2 8.5" fill="none" stroke="#D6CDBB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </marker>
            <marker id="mh" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto">
              <path d="M2 1.5 L8 5 L2 8.5" fill="none" stroke="#E3A08C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </marker>
          </defs>
          <g id="bridges"></g>
          <g id="hintLayer"></g>
        </svg>
      </div>
    </div>
  </div>
  <div class="time">
    <div class="track"></div>
    <div id="turtle">🐢<span id="zzz">z z z</span></div>
    <div id="note"></div>
  </div>
</div>

<div id="start" class="overlay">
  <div class="strip">
    <span style="background:var(--d0)">1</span><span style="background:var(--d1)">11</span><span style="background:var(--d2)">21</span><span style="background:var(--d3)">31</span><span style="background:var(--d4)">41</span>
  </div>
  <h1>Numbers</h1>
  <p id="rangeLabel">1 to 100</p>
  <button class="btn" id="play">▶ Play</button>
  <p class="small-note">Grown-ups: hold ⚙︎ for settings</p>
</div>

<div id="end" class="overlay" hidden>
  <div class="big" id="animal">🐬</div>
  <h1>All done!</h1>
  <p>See you tomorrow</p>
  <p id="bye"></p>
</div>

<div id="settings" class="overlay" hidden>
  <div class="sheet">
    <h2>For grown-ups</h2>
    <div class="row"><span>Numbers</span>
      <div class="seg" id="range">
        <button data-r="50">1 – 50</button><button data-r="100">1 – 100</button>
      </div>
    </div>
    <div class="row"><span>Play time</span>
      <div class="slide"><input type="range" id="mins" min="5" max="20" step="1"><output id="minsOut"></output></div>
    </div>
    <div class="row"><span>Time</span>
      <div class="seg" id="timeMode">
        <button data-t="strict" title="The game ends when the play time is over">Strict</button><button data-t="lenient" title="The child finishes every question; the turtle naps when the questions fall behind">Lenient</button>
      </div>
    </div>
    <p class="hint-text" id="timeHint"></p>
    <div class="row"><span>Tens beads</span>
      <div class="seg" id="beadHelp">
        <button data-h="guided" title="The tens rod stops at the right count, then the ones rod opens">Stop at the count</button><button data-h="done" title="The child decides how many, then taps Done">Child taps Done</button>
      </div>
    </div>
    <label class="row"><span>Hide some numbers</span><input type="checkbox" id="fadeOn"></label>
    <label class="row"><span>Music</span><input type="checkbox" id="musicOn"></label>
    <label class="row"><span>Voice</span><input type="checkbox" id="voiceOn"></label>
    <div class="row">
      <select id="voicePick"></select>
      <button class="btn sm alt" id="testVoice">Test</button>
    </div>
    <h3>Each game</h3>
    <p class="hint-text">Changes start with the next game. "1–2" picks one or two at random.</p>
    <div id="qCounts"></div>
    <div class="row btns">
      <button class="btn sm alt" id="close">Close</button>
      <button class="btn sm" id="restart">Start again</button>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const col = n => Math.floor((n - 1) / 10);
const tint = n => `var(--d${col(n)})`;
const num = n => `<span class="num" style="--t:${tint(n)}">${n}</span>`;
const range = (a, b, step = 1) => { const r = []; for (let n = a; n <= b; n += step) r.push(n); return r; };

/* ---------------- settings ---------------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('numbers.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('numbers.' + k, JSON.stringify(v)); } catch {} },
};
// how many of each question a game has; 1.5 means one or two, picked at random
const Q_DEFAULTS = { compare: 3, after: 1.5, before: 1.5, ten: 1.5, missing: 1.5, show: 2, build: 2, find: 3 };
const settings = Object.assign({ max: 100, minutes: 9, time: 'lenient', count: 20, beadHelp: 'guided', fade: false, music: true, voice: true, voiceName: '' }, store.get('settings', {}));
settings.qs = { ...Q_DEFAULTS, ...settings.qs };
// play time used to be 3/5/7 buttons defaulting to 5; move older saved settings onto the new 7 min default
if (!settings.slider) { settings.minutes = 9; settings.slider = true; }
// the default went from 7 to 9 minutes; move devices still on the old default
if (!settings.nine) { if (settings.minutes === 7) settings.minutes = 9; settings.nine = true; }
settings.minutes = Math.min(20, Math.max(5, settings.minutes));
const saveSettings = () => store.set('settings', settings);
let N = settings.max; // highest number on the board, fixed for a session

/* ---------------- music box (public-domain tunes) ---------------- */
const SONGS = [
  // Twinkle Twinkle Little Star
  'C5 1,C5 1,G5 1,G5 1,A5 1,A5 1,G5 2,F5 1,F5 1,E5 1,E5 1,D5 1,D5 1,C5 2,G5 1,G5 1,F5 1,F5 1,E5 1,E5 1,D5 2,G5 1,G5 1,F5 1,F5 1,E5 1,E5 1,D5 2,C5 1,C5 1,G5 1,G5 1,A5 1,A5 1,G5 2,F5 1,F5 1,E5 1,E5 1,D5 1,D5 1,C5 2',
  // Row Row Row Your Boat
  'C5 1.5,C5 1.5,C5 1,D5 .5,E5 1.5,E5 1,D5 .5,E5 1,F5 .5,G5 3,C6 .5,C6 .5,C6 .5,G5 .5,G5 .5,G5 .5,E5 .5,E5 .5,E5 .5,C5 .5,C5 .5,C5 .5,G5 1,F5 .5,E5 1,D5 .5,C5 3',
  // Mary Had a Little Lamb
  'E5 1,D5 1,C5 1,D5 1,E5 1,E5 1,E5 2,D5 1,D5 1,D5 2,E5 1,G5 1,G5 2,E5 1,D5 1,C5 1,D5 1,E5 1,E5 1,E5 1,E5 1,D5 1,D5 1,E5 1,D5 1,C5 4',
].map(s => s.split(',').map(t => {
  const [name, beats] = t.trim().split(' ');
  const semis = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[name[0]];
  return [12 * (+name.slice(1) + 1) + semis, +beats];
}));
const BEAT = 0.62;
const MUSIC_LEVEL = 0.35, MUSIC_DUCKED = 0.15;

let ac, master, musicGain, sfxGain;
let musicTimer = null, songIdx = 0, noteIdx = 0, nextTime = 0;
let speaking = false, musicFading = false;

function initAudio() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.connect(ac.destination);
  musicGain = ac.createGain(); musicGain.gain.value = 0;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
  musicGain.connect(lp); lp.connect(master);
  sfxGain = ac.createGain(); sfxGain.gain.value = 0.5; sfxGain.connect(master);
  // Safari can leave the context suspended; wake it on any tap
  document.addEventListener('pointerdown', () => { if (ac.state !== 'running') ac.resume(); });
}

function pluck(freq, t, dur, vol, dest) {
  const g = ac.createGain(), o = ac.createOscillator(), o2 = ac.createOscillator(), g2 = ac.createGain();
  o.type = 'sine'; o.frequency.value = freq;
  o2.type = 'sine'; o2.frequency.value = freq * 2; g2.gain.value = 0.12;
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(dest);
  const end = t + Math.max(dur, 0.4) + 0.8;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, end);
  o.start(t); o2.start(t); o.stop(end); o2.stop(end);
}

function scheduleMusic() {
  if (nextTime < ac.currentTime) nextTime = ac.currentTime + 0.05;
  while (nextTime < ac.currentTime + 0.5) {
    const song = SONGS[songIdx];
    if (noteIdx >= song.length) { songIdx = (songIdx + 1) % SONGS.length; noteIdx = 0; nextTime += BEAT * 4; continue; }
    const [midi, beats] = song[noteIdx++];
    pluck(440 * 2 ** ((midi - 69) / 12), nextTime, beats * BEAT, 0.5, musicGain);
    nextTime += beats * BEAT;
  }
}
function startMusic() {
  if (musicTimer) return;
  songIdx = rnd(0, SONGS.length - 1); noteIdx = 0; nextTime = ac.currentTime + 0.3;
  musicTimer = setInterval(scheduleMusic, 120);
}
function stopMusic() { clearInterval(musicTimer); musicTimer = null; }

function setMusicLevel(ramp = 0.4) {
  if (!ac) return;
  const target = !settings.music || musicFading ? 0 : speaking ? MUSIC_DUCKED : MUSIC_LEVEL;
  // setTargetAtTime glides from the live value; Safari's gain.value getter ignores ramps in progress
  const g = musicGain.gain, now = ac.currentTime;
  g.cancelScheduledValues(now); g.setTargetAtTime(target, now, ramp / 3);
}

function chime() {
  if (!ac) return;
  const t = ac.currentTime;
  pluck(1046.5, t, 0.3, 0.35, sfxGain);
  pluck(1568, t + 0.12, 0.3, 0.25, sfxGain);
}

/* ---------------- voice: prefer an Indian English female voice ---------------- */
let voice = null, utterance = null;
const voiceLang = v => v.lang.replace('_', '-').toLowerCase();
// English voices, Indian ones first
function englishVoices() {
  if (!('speechSynthesis' in window)) return [];
  // Apple's joke voices (Bubbles, Zarvox…) aren't for this game
  const novelty = /^(albert|bad news|bahh|bells|boing|bubbles|cellos|fred|good news|jester|junior|kathy|organ|ralph|superstar|trinoids|whisper|wobble|zarvox)\b/i;
  const vs = speechSynthesis.getVoices().filter(v => voiceLang(v).startsWith('en') && !novelty.test(v.name));
  return [...vs.filter(v => voiceLang(v) === 'en-in'), ...vs.filter(v => voiceLang(v) !== 'en-in')];
}
// Premium/Enhanced/Natural voices sound human; the compact ones sound robotic.
// Safari can list e.g. two "Isha"s, so the quality is read from the voiceURI too.
const voiceQuality = v => /premium/i.test(v.name + v.voiceURI) ? 3
  : /enhanced|natural|neural/i.test(v.name + v.voiceURI) ? 2 : 0;
const voiceLabel = v => v.name + (voiceQuality(v) && !/\(.+\)/.test(v.name) ? (voiceQuality(v) === 3 ? ' (Premium)' : ' (Enhanced)') : '');

function voiceScore(v) {
  const female = /isha|tara|veena|sangeeta|neerja|swara|kajal|aditi|raveena|heera|female|samantha|karen|moira|tessa|serena|zira|aria|jenny|sonia/i;
  const male = /\b(rishi|aman|prabhat|ravi|hemant|male)\b/i;
  return (voiceLang(v) === 'en-in' ? 100 : 0)
    + voiceQuality(v) * 15
    + (female.test(v.name) ? 20 : male.test(v.name) ? 0 : 10);
}
function pickVoice() {
  const vs = englishVoices();
  voice = vs.find(v => v.voiceURI === settings.voiceName || v.name === settings.voiceName)
    || vs.reduce((best, v) => (!best || voiceScore(v) > voiceScore(best) ? v : best), null);
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.addEventListener('voiceschanged', pickVoice); }

/* recorded clips (made by tools/voice_clips.py), with the device voice as the fallback.
   A line is cut into sentences, and " | " marks extra cuts inside one, so
   "Which is bigger, | 34 | or 43?" plays three clips instead of needing one per pair. */
const CLIPS = '../../../voice/'; // shared by every game, at the root of the repo
let clipIndex = {}, clipCache = new Map(), clipPlay = null, speechId = 0;
fetch(CLIPS + 'clips.json').then(r => r.json()).then(j => { clipIndex = j; }).catch(() => {});
const clipPieces = text => text.split(/(?<=[.!?])\s+/).map(s => s.split(' | ').map(p => p.trim().replace(/\.$/, '')).filter(Boolean));
const plain = text => text.replace(/ \| /g, ' ');
const useClips = () => !settings.voiceName && ac;

function loadClip(key) {
  if (!clipCache.has(key)) {
    clipCache.set(key, fetch(CLIPS + clipIndex[key])
      .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
      .then(b => new Promise((res, rej) => ac.decodeAudioData(b, res, rej))));
  }
  return clipCache.get(key);
}
// fetch clips ahead of time so there's no pause before they're needed
function preload(...texts) {
  if (!useClips()) return;
  for (const t of texts) for (const k of clipPieces(t).flat()) if (k in clipIndex) loadClip(k).catch(() => {});
}
// pauses, in seconds: between pieces of a sentence, between sentences, and before a new line when
// the last one finished just now (an interrupted line, like a tap mid-count, gets no pause)
const GAP = { piece: 0.05, sentence: 0.45, line: 0.6 };
const PAUSE_AFTER = { "Let's make": 0.3 }; // "Let's make … 34", not "Let's make34"
let lineEnd = 0; // when the last line that played to the end finished, on the audio clock

function stopClips() {
  if (!clipPlay) return;
  lineEnd = 0;
  clipPlay.sources.forEach(s => { try { s.stop(); } catch {} });
  clearTimeout(clipPlay.timer); clipPlay.done();
  clipPlay = null; speaking = false; setMusicLevel();
}
function stopSpeech() { speechId++; stopClips(); window.speechSynthesis?.cancel(); }

// true if the whole line was played from clips; false means use the device voice
async function playClips(text, id) {
  const sentences = clipPieces(text), keys = sentences.flat();
  if (!keys.length || !keys.every(k => k in clipIndex)) return false;
  let bufs;
  try { bufs = await Promise.all(keys.map(loadClip)); } catch { return false; }
  if (id !== speechId) return true;
  window.speechSynthesis?.cancel();
  speaking = true; setMusicLevel(0.2);
  const sources = [];
  let t = Math.max(ac.currentTime + 0.05, lineEnd + GAP.line), i = 0, end = t;
  sentences.forEach(s => s.forEach((k, j) => {
    const src = ac.createBufferSource();
    src.buffer = bufs[i++]; src.connect(master); src.start(t); sources.push(src);
    end = t + src.buffer.duration;
    t = end + (PAUSE_AFTER[k] ?? (j < s.length - 1 ? GAP.piece : GAP.sentence));
  }));
  await new Promise(done => {
    clipPlay = { sources, done, timer: setTimeout(done, (end - ac.currentTime) * 1000) };
  });
  if (id === speechId) { clipPlay = null; speaking = false; setMusicLevel(); lineEnd = end; }
  return true;
}

async function speak(text) {
  stopClips();
  const id = ++speechId;
  if (!text) return;
  if (!settings.voice) return wait(400);
  if (useClips() && await playClips(text, id)) return;
  if (id === speechId) return speakDevice(plain(text));
}

function speakDevice(text) {
  return new Promise(res => {
    if (!('speechSynthesis' in window)) return setTimeout(res, 400);
    if (!voice) pickVoice(); // some browsers only list voices after the page has loaded
    if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
    const u = utterance = new SpeechSynthesisUtterance(text);
    if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = 'en-IN';
    u.rate = 0.85; u.pitch = 1.05;
    let done = false;
    const fin = () => { if (done) return; done = true; if (utterance === u) { speaking = false; setMusicLevel(); } res(); };
    u.onstart = () => { speaking = true; setMusicLevel(0.2); };
    u.onend = fin; u.onerror = fin;
    setTimeout(fin, 1500 + text.length * 110); // some browsers never fire onend
    speechSynthesis.speak(u);
  });
}

/* ---------------- grid ---------------- */
const grid = $('#grid');
let tiles = [], rings = [], blanks = new Set();

function buildGrid() {
  N = settings.max;
  tiles.forEach(t => t && t.remove()); rings.forEach(r => r.remove());
  tiles = []; rings = [];
  for (let c = 0; c < N / 10; c++) {
    const r = document.createElement('div');
    r.className = 'colring'; r.style.gridColumn = c + 1; r.style.setProperty('--b', `var(--b${c})`);
    grid.insertBefore(r, $('#arrows')); rings.push(r);
  }
  for (let n = 1; n <= N; n++) {
    const b = document.createElement('button');
    b.className = 'tile'; b.style.setProperty('--t', tint(n)); b.textContent = n;
    b.style.gridColumn = col(n) + 1; b.style.gridRow = (n - 1) % 10 + 1;
    b.addEventListener('click', () => onTile(n));
    grid.insertBefore(b, $('#arrows'));
    tiles[n] = b;
  }
  grid.style.setProperty('--cols', N / 10);
  $('#app').classList.toggle('wide', N > 50);
  $('#rangeLabel').textContent = `1 to ${N}`;
  drawBridges();
}
function renderTiles() {
  for (let n = 1; n <= N; n++) { tiles[n].className = 'tile'; tiles[n].textContent = blanks.has(n) ? '' : n; }
  rings.forEach(r => r.classList.remove('on'));
}
function reveal(n) { blanks.delete(n); tiles[n].textContent = n; tiles[n].classList.remove('qmark'); }
function randomBlanks(protect) {
  const b = new Set();
  if (settings.fade) for (let n = 1; n <= N; n++) if (!protect.has(n) && Math.random() < .35) b.add(n);
  return b;
}

/* ---------------- arrows ---------------- */
const NS = 'http://www.w3.org/2000/svg';
let hint = null; // {from, to}

function rel(n) {
  const g = grid.getBoundingClientRect(), r = tiles[n].getBoundingClientRect();
  return { l: r.left - g.left, r: r.right - g.left, cy: (r.top + r.bottom) / 2 - g.top, h: r.height, w: r.width };
}
// the chalkboard arrow: bottom of column c, up the gap, into the top of column c+1
function bridgePath(c, backwards) {
  const A = rel(c * 10 + 10), B = rel(c * 10 + 11), gx = (A.r + B.l) / 2;
  const fwd = `M ${A.r - 2} ${A.cy} Q ${gx} ${A.cy + A.h * .55} ${gx} ${A.cy - A.h * .3} L ${gx} ${B.cy + B.h * .3} Q ${gx} ${B.cy - B.h * .55} ${B.l + 2} ${B.cy}`;
  const back = `M ${B.l + 2} ${B.cy} Q ${gx} ${B.cy - B.h * .55} ${gx} ${B.cy + B.h * .3} L ${gx} ${A.cy - A.h * .3} Q ${gx} ${A.cy + A.h * .55} ${A.r - 2} ${A.cy}`;
  return backwards ? back : fwd;
}
function addPath(layer, d, cls, marker) {
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('d', d); p.setAttribute('class', cls); p.setAttribute('marker-end', `url(#${marker})`);
  layer.appendChild(p);
}
function drawBridges() {
  const layer = $('#bridges'); layer.innerHTML = '';
  for (let c = 0; c < N / 10 - 1; c++) addPath(layer, bridgePath(c), 'bridge', 'mb');
}
function drawHint() {
  const layer = $('#hintLayer'); layer.innerHTML = '';
  if (!hint) return;
  const { from, to } = hint, A = rel(from), B = rel(to);
  let d;
  if (Math.abs(from - to) === 1 && col(from) !== col(to)) {
    d = bridgePath(Math.min(col(from), col(to)), to < from);
  } else if (col(from) === col(to)) {
    const bulge = A.w * .28;
    d = `M ${A.l + 3} ${A.cy} Q ${A.l - bulge} ${(A.cy + B.cy) / 2} ${B.l + 3} ${B.cy}`;
  } else {
    d = to > from ? `M ${A.r - 2} ${A.cy} L ${B.l + 2} ${B.cy}` : `M ${A.l + 2} ${A.cy} L ${B.r - 2} ${B.cy}`;
  }
  addPath(layer, d, 'hint', 'mh');
}
new ResizeObserver(() => { drawBridges(); drawHint(); }).observe(grid);

/* ---------------- questions ---------------- */
// the tricky spots at the bottom/top of each column
const edgeAfter = () => range(10, N - 10, 10);  // 10, 20, 30 …
const edgeBefore = () => range(11, N - 9, 10);  // 11, 21, 31 …
// pairs like 34 / 43 that both fit on the board
const swappedPairs = () => {
  const pairs = [];
  for (let a = 1; a <= 9; a++) for (let b = a + 1; b <= 9; b++) if (10 * b + a <= N) pairs.push([10 * a + b, 10 * b + a]);
  return pairs;
};

const tensW = t => t === 1 ? '1 ten' : `${t} tens`;
const onesW = o => o === 1 ? '1 one' : `${o} ones`;
const tensOnes = x => [Math.floor(x / 10), x % 10];
// tens and ones on the bead frame, for a number with at least one ten and no hundreds:
// "show": "Make 32", the child puts on the beads; "build": "3 tens and 2 ones", the child puts them on, then finds the number
function beadQ(ask, x = rnd(10, Math.min(N, 99))) {
  const [t, o] = tensOnes(x);
  return { type: 'beads', ask, x, t, o, answer: x };
}

function makeQ(type) {
  switch (type) {
    case 'find': { const x = rnd(1, N); return { type, x, answer: x }; }
    case 'after': { const x = Math.random() < .5 ? pick(edgeAfter()) : rnd(1, N - 1); return { type, x, answer: x + 1 }; }
    case 'before': { const x = Math.random() < .5 ? pick(edgeBefore()) : rnd(2, N); return { type, x, answer: x - 1 }; }
    case 'ten': {
      // only whole tens for now: "10 more than 20", "10 less than 40"
      const more = Math.random() < .5, x = more ? pick(range(10, N - 10, 10)) : pick(range(20, N, 10));
      return { type, more, x, answer: more ? x + 10 : x - 10 };
    }
    case 'compare': {
      let a, b; const r = Math.random();
      if (r < .4) [a, b] = pick(swappedPairs());
      else if (r < .7) { const e = pick(edgeAfter()); a = e - rnd(0, 2); b = e + rnd(1, 3); }
      else { a = rnd(1, N); do b = rnd(1, N); while (Math.abs(a - b) < 2); }
      if (Math.random() < .5) [a, b] = [b, a];
      const bigger = Math.random() < .6;
      return { type, a, b, bigger, answer: bigger ? Math.max(a, b) : Math.min(a, b) };
    }
    case 'missing': {
      const x = Math.random() < .4 ? pick([1, N, ...edgeAfter(), ...edgeBefore()]) : rnd(1, N);
      const swap = x > 10 && x % 10 ? (x % 10) * 10 + Math.floor(x / 10) : 0;
      const pool = shuffle([x + 10, x - 10, swap, x + 2, x - 2].filter(n => n >= 1 && n <= N && n !== x));
      return { type, x, answer: x, choices: [x, ...new Set(pool)].slice(0, 3) };
    }
    case 'show': case 'build': return beadQ(type);
  }
}

function describe(q) {
  switch (q.type) {
    case 'find': return { html: `Tap the number ${num(q.x)}`, say: `Tap the number ${q.x}.` };
    case 'after': return { html: `What comes after ${num(q.x)}?`, say: `What comes after ${q.x}?` };
    case 'before': return { html: `What comes before ${num(q.x)}?`, say: `What comes before ${q.x}?` };
    case 'ten': {
      const w = q.more ? 'more' : 'less';
      return { html: `What is 10 ${w} than ${num(q.x)}?`, say: `What is 10 ${w} than ${q.x}?` };
    }
    case 'compare': {
      const w = q.bigger ? 'bigger' : 'smaller';
      return { html: `Which is <b>${w}</b>?`, say: `Which is ${w}, | ${q.a} | or ${q.b}?` };
    }
    case 'missing': return { html: 'Which number is hiding?', say: 'Which number is hiding?' };
    case 'beads': return q.ask === 'show'
      ? { html: `Make ${num(q.x)}`, say: `Let's make | ${q.x}. First the tens.` }
      : { html: `<b>${q.t}</b> ${q.t === 1 ? 'ten' : 'tens'} and <b>${q.o}</b> ${q.o === 1 ? 'one' : 'ones'}`,
          say: `Let's make | ${tensW(q.t)} | and ${onesW(q.o)}. First the tens.` };
  }
}

function explain(q) {
  const { x, answer } = q;
  switch (q.type) {
    case 'find': return `Here it is. ${x}.`;
    case 'after':
      return x % 10 === 0
        ? `${x} is at the bottom. So we go up, to the top of the next line. After ${x} comes ${answer}.`
        : `After ${x} comes ${answer}.`;
    case 'before':
      return x % 10 === 1
        ? `${x} is at the top. So we go back, to the bottom of the line before. Before ${x} comes ${answer}.`
        : `Before ${x} comes ${answer}.`;
    case 'ten':
      return q.more ? `10 more is one step across. 10 more than ${x} is ${answer}.`
                    : `10 less is one step back. 10 less than ${x} is ${answer}.`;
    case 'compare': {
      const s = Math.min(q.a, q.b), b = Math.max(q.a, q.b);
      return `When we count, | ${s} | comes first, then ${b}. So ${answer} is ${q.bigger ? 'bigger' : 'smaller'}.`;
    }
    case 'missing':
      if (x === 1) return 'Before 2 comes 1.';
      return x % 10 === 1
        ? `${x - 1} is at the bottom, so the next one is at the top. After ${x - 1} comes ${x}.`
        : `After ${x - 1} comes ${x}.`;
    case 'beads': return `Look at the last bead. That's ${x}.`; // the wrong number was tapped after building it
  }
}

const PRAISE = ['Yes!', 'Well done!', "That's right!", 'Good job!'], PRAISE_AGAIN = ["Yes, that's it.", 'There you go.'];
function praise(q, tries, p = pick(tries ? PRAISE_AGAIN : PRAISE)) {
  const { x, answer } = q;
  switch (q.type) {
    case 'find': return `${p} That's ${x}.`;
    case 'after': return `${p} After ${x} comes ${answer}.`;
    case 'before': return `${p} Before ${x} comes ${answer}.`;
    case 'ten': return `${p} 10 ${q.more ? 'more' : 'less'} than ${x} is ${answer}.`;
    case 'compare': return `${p} ${answer} is ${q.bigger ? 'bigger' : 'smaller'}.`;
    case 'missing': return `${p} It's ${x}.`;
    case 'beads': return `${p} ${tensW(q.t)} and ${onesW(q.o)} make ${x}.`; // one clip per number: in pieces it sounded choppy
  }
}

let plan = [], retry = [], lastAnswer = 0, asked = new Set();
let total = 0, done = 0; // questions in the plan, and how many of them are answered (missed ones that come back don't count)
const howMany = n => n === 1.5 ? rnd(1, 2) : n;
// the game's questions as the settings ask: the mix shuffled, then "tap the number" at the end,
// since finding a number among 100 is hard until the layout is familiar
function makePlan(finds) {
  const types = [];
  for (const [type, n] of Object.entries(settings.qs)) if (type !== 'find') for (let i = howMany(n); i > 0; i--) types.push(type);
  shuffle(types);
  if (finds) for (let i = howMany(settings.qs.find); i > 0; i--) types.push('find');
  return types;
}
// the same question twice in a session; 34/43 and 43/34 count as the same
const qKey = q => [q.type, q.ask, q.x, Math.min(q.a, q.b), Math.max(q.a, q.b), q.more, q.bigger].join();
function nextQ() {
  retry.forEach(r => r.due--);
  let i = retry.findIndex(r => r.due <= 0);
  if (i < 0 && !plan.length) i = 0; // nothing else left to ask
  if (i >= 0) return retry.splice(i, 1)[0].q; // only missed questions come back
  const type = plan.shift();
  let q;
  for (let tries = 0; tries < 40; tries++) {
    q = makeQ(type);
    if (q.answer !== lastAnswer && !asked.has(qKey(q))) break;
  }
  asked.add(qKey(q));
  return q;
}

/* ---------------- step 1: a warm-up, counting from the top of a column (1, 11, 21 …) ---------------- */
let mode = 'count', countNext = 0, countEnd = 0, countIdle = null;
// the tops of the columns the count fits after, on the board
const countStarts = (len, max) => range(1, max - len + 1, 10);
const countIntro = (len, from) => `Let's warm up by counting ${len} numbers. We'll start from ${from}.`;

function startCounting() {
  const len = Math.min(settings.count, N);
  if (!len) return startQuiz();
  countNext = pick(countStarts(len, N)); countEnd = countNext + len - 1;
  mode = 'count'; current = null;
  blanks = randomBlanks(new Set([countNext]));
  renderTiles(); hint = null; drawHint();
  $('#choices').innerHTML = '';
  setCountPrompt();
  $('#skip').hidden = false;
  locked = false;
  speak(countIntro(len, countNext));
  armIdle();
}
function setCountPrompt() { $('#prompt').innerHTML = `Let's count!<br>Tap ${num(countNext)}`; }
// when the child gets stuck, softly show where the next number is
function armIdle() { clearTimeout(countIdle); countIdle = setTimeout(() => tiles[countNext].classList.add('glow'), 8000); }

function countTap(n) {
  if (locked) return;
  if (n < countNext && tiles[n].classList.contains('good')) return;
  if (n !== countNext) {
    tiles[n].classList.add('dim'); setTimeout(() => tiles[n].classList.remove('dim'), 1200);
    tiles[countNext].classList.add('glow');
    speak(`Find ${countNext}.`);
    return;
  }
  tiles[n].classList.remove('glow'); reveal(n); tiles[n].classList.add('good');
  if (n === countEnd) return endCounting(n);
  countNext++;
  speak(n % 10 === 0 ? `${n}. Now up to the top!` : String(n));
  setCountPrompt(); armIdle();
}

async function endCounting(last) {
  clearTimeout(countIdle); locked = true; $('#skip').hidden = true;
  if (last) {
    chime(); $('#prompt').innerHTML = `${last}! Well done!`;
    await speak(`${last}. Well done!`); await wait(500); // the number and the praise already have clips
  }
  startQuiz();
}

/* ---------------- step 2: questions ---------------- */
let current = null, locked = true, tries = 0, cards = {}, findsSaid = false;

async function startQuiz() {
  mode = 'quiz'; current = null;
  blanks = new Set(); renderTiles();
  $('#prompt').innerHTML = '';
  if (plan.length) await speak('Now, some questions.');
  next();
}

function show(q) {
  current = q; tries = 0; hint = null; lastAnswer = q.answer;
  const protect = new Set([q.x, q.a, q.b].filter(Boolean));
  if (q.type === 'missing') { protect.add(q.x - 1); protect.add(q.x + 1); }
  if (q.choices) q.choices = shuffle([...q.choices]);
  blanks = q.type === 'beads' ? new Set() : randomBlanks(protect);
  if (q.type === 'missing') blanks.add(q.x);
  renderTiles();
  $('#beads').hidden = q.type !== 'beads';
  if (q.type === 'beads') { Object.assign(q, { tens: 0, ones: 0, phase: 'tens' }); renderBeads(q); }
  if (q.type === 'missing') { tiles[q.x].textContent = '?'; tiles[q.x].classList.add('qmark', 'ref'); }
  else if (q.type === 'compare') { tiles[q.a].classList.add('ref'); tiles[q.b].classList.add('ref'); }
  // no ring on 43 for "what comes after 43?": it was taken as the number to tap

  const d = describe(q);
  q.say = d.say;
  $('#prompt').innerHTML = d.html;
  fitBeads(); requestAnimationFrame(() => fitBeads()); // again once the page has laid out
  const box = $('#choices'); box.innerHTML = ''; cards = {};
  for (const n of q.type === 'compare' ? [q.a, q.b] : q.choices || []) {
    const b = document.createElement('button');
    b.className = 'card'; b.textContent = n;
    b.addEventListener('click', () => answer(n, b));
    box.appendChild(b); cards[n] = b;
  }
  drawHint();
  locked = false;
  speak(q.say);
  preload(explain(q), praise(q, 0, ''), ...(q.type === 'beads' ? beadLines(q) : []));
}

function onTile(n) {
  if (mode === 'count') return countTap(n);
  if (!current || current.choices) return; // answered with the cards
  if (current.type === 'beads' && current.phase !== 'find') return; // the beads come first
  if (current.type === 'compare' && n !== current.a && n !== current.b) return;
  answer(n, tiles[n]);
}

function showHint(q) {
  const glow = el => el && el.classList.add('glow');
  glow(cards[q.answer]);
  if (q.type === 'missing') {
    for (const n of [q.x - 1, q.x + 1]) if (n >= 1 && n <= N) { reveal(n); tiles[n].classList.add('ref'); }
  } else glow(tiles[q.answer]);
  if (['after', 'before', 'ten'].includes(q.type)) {
    tiles[q.x].classList.add('ref');
    hint = { from: q.x, to: q.answer }; drawHint();
  }
}

async function answer(n, el) {
  if (locked || !current) return;
  const q = current;
  locked = true;
  if (n === q.answer) {
    hint = null; drawHint();
    document.querySelectorAll('.glow').forEach(e => e.classList.remove('glow'));
    el.classList.add('good'); cards[q.answer]?.classList.add('good');
    tiles[q.answer].classList.add('good'); reveal(q.answer);
    if (q.type === 'beads') q.phase = 'done';
    if (!q.retry) done++;
    chime();
    await speak(praise(q, tries));
    await wait(600);
    next();
    return;
  }
  tries++;
  el.classList.add('dim'); setTimeout(() => el.classList.remove('dim'), 1600);
  if (el.classList.contains('tile')) reveal(n);
  if (!q.hinted) { // the first wrong answer (a bead miss before it doesn't count)
    q.hinted = true;
    if (q.type !== 'find') comeBack(q);
    await speak("Let's look together.");
    showHint(q);
    await speak(explain(q));
  } else {
    await speak('Tap the glowing one.');
  }
  locked = false;
}

// a missed question comes back 3 questions later, once
function comeBack(q) {
  if (q.retry || q.queued) return;
  q.queued = true;
  retry.push({ q: q.type === 'beads' ? { ...beadQ(q.ask, q.x), retry: true } : { ...q, retry: true, queued: false, hinted: false }, due: 3 });
}

/* ---------------- tens and ones on the bead frame ---------------- */
// Tens first (the ones rod waits), then ones. Each tens bead lights up its column of ten on the board
// and says 10, 20, 30; each ones bead lights up the next square and counts on, 31, 32. With
// "Stop at the count" each rod stops at the right number; with "Child taps Done" the child decides, and can
// tap the top bead to take it off.
const beadsT = [], beadsO = [];
for (const [rod, list] of [[$('#rodT'), beadsT], [$('#rodO'), beadsO]]) {
  for (let i = 0; i < 10; i++) {
    const b = document.createElement('span');
    b.className = 'bead'; b.style.bottom = `calc(6px + ${i} * (var(--bh) + 4px))`;
    rod.appendChild(b); list.push(b);
  }
}

// make the beads smaller until everything in the panel fits its height (an iPad in landscape is short)
function fitBeads() {
  const panel = $('.panel'), box = $('#beads');
  if (box.hidden) return;
  const fits = () => {
    const p = panel.getBoundingClientRect();
    const r = [...panel.children].filter(k => k.offsetParent).map(k => k.getBoundingClientRect());
    return Math.min(...r.map(k => k.top)) >= p.top - 1 && Math.max(...r.map(k => k.bottom)) <= p.bottom + 1;
  };
  for (let bh = 28; bh >= 10; bh -= 2) {
    box.style.setProperty('--bh', `${bh}px`);
    if (fits()) break;
  }
}
// measure again whenever the panel changes size, not just on a window resize: the iPad's browser bars
// can squeeze the panel for a moment, and the beads stayed tiny after measuring then
new ResizeObserver(() => fitBeads()).observe($('.panel'));
document.fonts?.ready.then(() => fitBeads());

function renderBeads(q) {
  beadsT.forEach((b, i) => { b.classList.toggle('on', i < q.tens); b.style.setProperty('--b', `var(--b${i})`); });
  beadsO.forEach((b, i) => { b.classList.toggle('on', i < q.ones); b.style.setProperty('--b', `var(--b${q.tens})`); });
  rings.forEach((r, i) => r.classList.toggle('on', i < q.tens));
  for (let n = 1; n <= N; n++) {
    const on = n > q.tens * 10 && n <= q.tens * 10 + q.ones;
    tiles[n].classList.toggle('one', on);
    if (on) tiles[n].style.setProperty('--b', `var(--b${q.tens})`);
  }
  const counting = q.phase === 'tens' || q.phase === 'ones';
  $('#rodT').disabled = q.phase !== 'tens';
  $('#rodO').disabled = q.phase !== 'ones';
  $('#digT').textContent = q.tens || (q.phase === 'tens' ? '' : 0);
  $('#digO').textContent = q.phase === 'tens' ? '' : (q.ones || (q.phase === 'ones' ? '' : 0));
  $('#digT').classList.toggle('set', q.phase !== 'tens');
  $('#digO').classList.toggle('set', !counting);
  $('#beadDone').hidden = settings.beadHelp !== 'done' || !counting;
}

const beadCount = q => String(q.tens * 10 + (q.phase === 'ones' ? q.ones : 0)); // 10, 20, 30, then 31, 32

function beadTap(key, e) {
  const q = current;
  if (locked || !q || q.type !== 'beads' || q.phase !== key) return;
  const list = key === 'tens' ? beadsT : beadsO, top = list[q[key] - 1];
  if (settings.beadHelp === 'done' && top && e.target === top) { // take the top bead off
    q[key]--; renderBeads(q);
    stopSpeech(); if (+beadCount(q)) speak(beadCount(q));
    return;
  }
  if (q[key] >= 9) return;
  q[key]++; renderBeads(q);
  stopSpeech();
  const said = speak(beadCount(q));
  if (settings.beadHelp === 'guided' && q[key] === (key === 'tens' ? q.t : q.o)) (key === 'tens' ? tensDone : onesDone)(q, said);
}
$('#rodT').addEventListener('click', e => beadTap('tens', e));
$('#rodO').addEventListener('click', e => beadTap('ones', e));

async function tensDone(q, said) {
  locked = true; q.phase = 'between'; renderBeads(q);
  await said; await wait(300);
  if (q.o === 0) { // nothing to put on the ones rod
    await speak(`${tensW(q.t)}. That's ${q.x}. And 0 ones.`);
    return onesDone(q);
  }
  q.phase = 'ones'; renderBeads(q); locked = false;
  speak(`${tensW(q.t)}. That's ${q.t * 10}. Now the ones.`);
}

async function onesDone(q, said) {
  locked = true; q.phase = 'between'; renderBeads(q);
  await said; await wait(300);
  if (q.ask === 'build') { // now find the number they make
    q.phase = 'find'; renderBeads(q);
    q.say = 'Which number did we make? Tap it.'; $('#prompt').innerHTML = 'Which number did we make?<br>Tap it.'; fitBeads();
    locked = false;
    return speak(q.say);
  }
  q.phase = 'done'; renderBeads(q);
  locked = false; answer(q.x, tiles[q.x]); // praise, then the next question
}

// "Child taps Done": check the count, and help when it's off
$('#beadDone').addEventListener('click', () => {
  const q = current;
  if (locked || !q || q.type !== 'beads' || (q.phase !== 'tens' && q.phase !== 'ones')) return;
  const key = q.phase, need = key === 'tens' ? q.t : q.o, have = q[key];
  if (have === need) return (key === 'tens' ? tensDone : onesDone)(q);
  tries++; comeBack(q);
  stopSpeech(); speak(beadMiss(q, key, have < need ? need - have : -1));
});
function beadMiss(q, key, short) {
  const what = key === 'ones' ? `We need | ${onesW(q.o)}.` : q.ask === 'show' ? `${q.x} | has ${tensW(q.t)}.` : `We need | ${tensW(q.t)}.`;
  return `${what} ${short === 1 ? 'Add one more.' : short > 1 ? 'Add some more.' : 'Tap the top bead to take one off.'}`;
}

// everything a bead question can say, for preload and allLines
function beadLines(q) {
  const lines = [describe(q).say, explain(q), praise(q, 0, ''), 'Which number did we make? Tap it.',
                 `${tensW(q.t)}. That's ${q.t * 10}. Now the ones.`, `${tensW(q.t)}. That's ${q.x}. And 0 ones.`];
  for (const key of ['tens', 'ones']) for (const short of [1, 2, -1]) lines.push(beadMiss(q, key, short));
  return lines;
}

/* ---------------- time: no hard stop, gentle warnings ---------------- */
// Strict: the game ends after the question that's on when the play time runs out, with reminders before.
// Lenient: the game ends when every question is done. The turtle walks at the play time's pace; if it
// gets to 70% with less than 70% of the questions done, it naps until 90% are done, then hurries
// along, and it only reaches the end with the last question.
let elapsed = 0, lastTick = 0, timerId = null, paused = false;
let warns = 0, finalQ = false; // warns: reminders given so far, "2 more minutes" then "1 more minute"
let turtle = 0, turtleState = 'walk'; // how far along the turtle is (0–1); walk, nap or hurry
const sessionMs = () => settings.minutes * 60000;
const lenient = () => settings.time === 'lenient';

function tick() {
  const now = performance.now(), dt = !document.hidden && !paused ? now - lastTick : 0;
  elapsed += dt; lastTick = now;
  if (!lenient()) turtle = Math.min(elapsed / sessionMs(), 1);
  else if ($('#end').hidden) {
    const share = total ? done / total : 1;
    if (turtleState === 'walk' && turtle >= .7 && share < .7) turtleState = 'nap';
    if (turtleState === 'nap' && share >= .9) turtleState = 'hurry';
    if (turtleState !== 'nap') turtle = Math.min(turtle + dt / sessionMs() * (turtleState === 'hurry' ? 2.5 : 1), .95);
  }
  drawTurtle();
}
function drawTurtle() {
  $('#turtle').style.setProperty('--p', turtle);
  $('#turtle').classList.toggle('asleep', lenient() && $('#end').hidden && (turtleState === 'nap' || turtle >= .95));
}

async function next() {
  if (finalQ) return finish();
  if (!plan.length && !lenient()) plan = makePlan(false); // time left over: another round, without the finds
  if (!plan.length && !retry.length) return finish();
  const left = sessionMs() - elapsed;
  if (lenient()) {
    if (plan.length + retry.length === 1) {
      finalQ = true; $('#note').textContent = 'Last one';
      await speak('Last one!');
    }
  } else if (left <= 15000) {
    finalQ = true; $('#note').textContent = 'Last one';
    await speak('Last one!');
  } else if (left <= 60000 && warns < 2) {
    warns = 2; $('#note').textContent = '1 more minute';
    await speak('Just one more minute to go!');
  } else if (left <= 120000 && warns < 1) {
    warns = 1; $('#note').textContent = '2 more minutes';
    await speak('Just 2 more minutes to go!');
  }
  const q = nextQ();
  if (q.type === 'find' && !findsSaid) {
    findsSaid = true;
    await speak("Now let's find some numbers.");
  }
  show(q);
}

// lines said outside the questions (allLines and preload use this list)
const SAY = ["Now let's find some numbers.", "Let's look together.", 'Tap the glowing one.', 'Last one!',
             'Just 2 more minutes to go!', 'Just one more minute to go!', 'Now, some questions.', 'Now up to the top!'];

const ANIMALS = [['🐬', 'dolphin'], ['🐒', 'monkey'], ['🐘', 'elephant'], ['🐢', 'turtle'], ['🐼', 'panda'], ['🦒', 'giraffe'],
                 ['🐧', 'penguin'], ['🐨', 'koala'], ['🦉', 'owl'], ['🐳', 'whale'], ['🐰', 'bunny'], ['🦆', 'duck'],
                 ['🦁', 'lion'], ['🐯', 'tiger'], ['🦓', 'zebra'], ['🐻', 'bear'], ['🦊', 'fox'], ['🐸', 'frog'],
                 ['🐱', 'cat'], ['🐶', 'puppy'], ['🐴', 'horse'], ['🐮', 'cow'], ['🐷', 'pig'], ['🐑', 'sheep'],
                 ['🐔', 'hen'], ['🦚', 'peacock'], ['🦜', 'parrot'], ['🦋', 'butterfly'], ['🐌', 'snail'], ['🐙', 'octopus'],
                 ['🦀', 'crab'], ['🐿️', 'squirrel'], ['🐫', 'camel'], ['🦌', 'deer'], ['🦛', 'hippo'], ['🦦', 'otter']];
const byeLine = name => `All done! See you tomorrow. Bye bye from the ${name}!`;

// every animal once before any comes back, remembered across days; only animals whose goodbye has a
// recorded clip, so a new one waits until it's recorded instead of switching to the device voice
function nextAnimal() {
  const ready = ANIMALS.filter(([, name]) => !useClips() || clipPieces(byeLine(name)).flat().every(k => k in clipIndex));
  const names = ready.map(([, name]) => name);
  let deck = store.get('animals', []).filter(n => names.includes(n));
  if (!deck.length) {
    const last = store.get('lastAnimal', '');
    deck = shuffle([...names]);
    if (deck[0] === last && deck.length > 1) deck.push(deck.shift()); // not the same two days running
  }
  const name = deck.shift();
  store.set('animals', deck); store.set('lastAnimal', name);
  return ready.find(([, n]) => n === name) || pick(ANIMALS);
}

async function finish() {
  current = null; locked = true; clearInterval(timerId); clearTimeout(countIdle);
  turtle = 1; drawTurtle();
  const [emoji, name] = nextAnimal();
  $('#animal').textContent = emoji;
  $('#bye').textContent = `Bye bye from the ${name}`;
  $('#end').hidden = false;
  musicFading = true; setMusicLevel(5);
  setTimeout(() => { if (musicFading) stopMusic(); }, 6000);
  await speak(byeLine(name));
}

let sessionStarted = false;
function startSession() {
  initAudio(); ac.resume();
  musicFading = false; startMusic(); setMusicLevel(1.5);
  if (N !== settings.max) buildGrid();
  sessionStarted = true;
  plan = makePlan(true); total = plan.length; done = 0;
  retry = []; asked = new Set(); lastAnswer = 0; current = null; locked = true; findsSaid = false;
  elapsed = 0; warns = 0; finalQ = false; paused = false; turtle = 0; turtleState = 'walk';
  $('#note').textContent = '';
  $('#start').hidden = true; $('#end').hidden = true;
  lastTick = performance.now(); clearInterval(timerId); timerId = setInterval(tick, 1000); tick();
  preload(...SAY, ...PRAISE, ...PRAISE_AGAIN, ...range(1, N).map(String));
  startCounting();
}

/* ---------------- controls ---------------- */
buildGrid();
$('#play').addEventListener('click', startSession);
$('#skip').addEventListener('click', () => {
  if (mode !== 'count' || locked) return;
  stopSpeech();
  endCounting();
});
$('#say').addEventListener('click', () => {
  if (mode === 'count') speak(`Tap ${countNext}.`);
  else if (current) speak(current.say);
});

const musicBtn = $('#musicBtn');
function syncMusicBtn() { musicBtn.classList.toggle('off', !settings.music); }
musicBtn.addEventListener('click', () => { settings.music = !settings.music; saveSettings(); syncMusicBtn(); syncSettingsUI(); setMusicLevel(); });
syncMusicBtn();

// settings open on a long press so little fingers don't find them
let pressTimer;
const gear = $('#gear');
gear.addEventListener('pointerdown', () => { pressTimer = setTimeout(openSettings, 900); });
['pointerup', 'pointerleave', 'pointercancel'].forEach(e => gear.addEventListener(e, () => clearTimeout(pressTimer)));
gear.addEventListener('contextmenu', e => e.preventDefault());

function syncSettingsUI() {
  document.querySelectorAll('#range button').forEach(b => b.classList.toggle('on', +b.dataset.r === settings.max));
  document.querySelectorAll('#beadHelp button').forEach(b => b.classList.toggle('on', b.dataset.h === settings.beadHelp));
  $('#mins').value = settings.minutes; $('#minsOut').textContent = `${settings.minutes} min`;
  document.querySelectorAll('#timeMode button').forEach(b => b.classList.toggle('on', b.dataset.t === settings.time));
  $('#timeHint').textContent = lenient()
    ? 'The child finishes every question. The turtle naps if the questions fall behind.'
    : 'The game ends after the question that is on when the play time is over.';
  document.querySelectorAll('#qCounts .step').forEach(s => { s.querySelector('output').textContent = stepLabel(s.dataset.k, stepValue(s.dataset.k)); });
  $('#fadeOn').checked = settings.fade;
  $('#musicOn').checked = settings.music;
  $('#voiceOn').checked = settings.voice;
  const sel = $('#voicePick');
  const vs = englishVoices();
  sel.innerHTML = '<option value="">Recorded voice (Leda)</option>'
    + vs.map(v => `<option value="${v.voiceURI}">${voiceLabel(v)}</option>`).join('');
  const chosen = vs.find(v => v.voiceURI === settings.voiceName || v.name === settings.voiceName);
  sel.value = chosen ? chosen.voiceURI : '';
}
function openSettings() { syncSettingsUI(); paused = true; $('#settings').hidden = false; }
function closeSettings() { $('#settings').hidden = true; paused = false; lastTick = performance.now(); }

// a new range needs a new board, so it starts a fresh session (or just redraws the start screen)
document.querySelectorAll('#range button').forEach(b => b.addEventListener('click', () => {
  if (+b.dataset.r === settings.max) return;
  settings.max = +b.dataset.r; saveSettings(); syncSettingsUI();
  closeSettings();
  if (sessionStarted && $('#end').hidden) startSession(); else buildGrid();
}));
document.querySelectorAll('#beadHelp button').forEach(b => b.addEventListener('click', () => {
  settings.beadHelp = b.dataset.h; saveSettings(); syncSettingsUI();
}));
$('#mins').addEventListener('input', e => { settings.minutes = +e.target.value; saveSettings(); syncSettingsUI(); tick(); });
document.querySelectorAll('#timeMode button').forEach(b => b.addEventListener('click', () => {
  settings.time = b.dataset.t; saveSettings(); syncSettingsUI(); tick();
}));

// a − n + stepper for the warm-up count and for each kind of question
const Q_NAMES = { count: 'Warm-up: numbers to count', compare: 'Bigger or smaller', after: 'What comes after', before: 'What comes before',
                  ten: '10 more, 10 less', missing: 'Which number is hiding', show: 'Make a number (beads)',
                  build: 'Tens and ones (beads)', find: 'Tap the number (at the end)' };
const STEPS = { count: range(0, 50, 10), q: [0, 1, 1.5, ...range(2, 10)] };
const stepValue = k => k === 'count' ? settings.count : settings.qs[k];
const stepLabel = (k, v) => k === 'count' && !v ? 'Off' : v === 1.5 ? '1–2' : String(v);
for (const k of Object.keys(Q_NAMES)) {
  const row = document.createElement('div');
  row.className = 'row q';
  row.innerHTML = `<span>${Q_NAMES[k]}</span><div class="step" data-k="${k}"><button data-d="-1" aria-label="Fewer">−</button><output></output><button data-d="1" aria-label="More">+</button></div>`;
  row.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    const steps = STEPS[k === 'count' ? 'count' : 'q'];
    const i = Math.min(steps.length - 1, Math.max(0, steps.indexOf(stepValue(k)) + +b.dataset.d));
    if (k === 'count') settings.count = steps[i]; else settings.qs[k] = steps[i];
    saveSettings(); syncSettingsUI();
  }));
  $('#qCounts').appendChild(row);
}
$('#fadeOn').addEventListener('change', e => { settings.fade = e.target.checked; saveSettings(); });
$('#musicOn').addEventListener('change', e => { settings.music = e.target.checked; saveSettings(); syncMusicBtn(); setMusicLevel(); });
$('#voiceOn').addEventListener('change', e => { settings.voice = e.target.checked; saveSettings(); if (!settings.voice) stopSpeech(); });
$('#voicePick').addEventListener('change', e => { settings.voiceName = e.target.value; saveSettings(); testVoice(); });
$('#testVoice').addEventListener('click', testVoice);
function testVoice() { initAudio(); ac.resume(); pickVoice(); speak('What comes after 20?'); }
$('#close').addEventListener('click', closeSettings);
$('#restart').addEventListener('click', () => { closeSettings(); startSession(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#settings').hidden) closeSettings(); });

// every piece of speech, for tools/voice_clips.py, which opens the page with #lines
function allLines() {
  const lines = [...SAY, ...PRAISE, ...PRAISE_AGAIN, 'What comes after 20?'], keepN = N;
  N = 100;
  for (const len of STEPS.count) if (len) for (const from of countStarts(len, 100)) lines.push(countIntro(len, from));
  for (const [, name] of ANIMALS) lines.push(byeLine(name));
  const qs = [];
  for (let x = 1; x <= N; x++) {
    lines.push(String(x), `Find ${x}.`, `Tap ${x}.`, `${x}. Now up to the top!`);
    qs.push({ type: 'find', x, answer: x }, { type: 'missing', x, answer: x });
    if (x < N) qs.push({ type: 'after', x, answer: x + 1 });
    if (x > 1) qs.push({ type: 'before', x, answer: x - 1 });
    if (x % 10 === 0 && x < N) qs.push({ type: 'ten', more: true, x, answer: x + 10 });
    if (x % 10 === 0 && x > 10) qs.push({ type: 'ten', more: false, x, answer: x - 10 });
    if (x >= 10 && x <= 99) for (const ask of ['show', 'build']) lines.push(...beadLines(beadQ(ask, x)));
    for (let b = 1; b <= N; b++) if (b !== x) for (const bigger of [true, false]) {
      qs.push({ type: 'compare', a: x, b, bigger, answer: bigger ? Math.max(x, b) : Math.min(x, b) });
    }
  }
  for (const q of qs) lines.push(describe(q).say, explain(q), praise(q, 0, ''));
  N = keepN;
  return [...new Set(lines.flatMap(t => clipPieces(t).flat()))];
}
if (location.hash === '#lines') document.body.innerHTML = `<pre id="lines">${JSON.stringify(allLines())}</pre>`;
</script>
</body>
